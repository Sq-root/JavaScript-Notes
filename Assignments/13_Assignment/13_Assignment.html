<!-- Problem Statment: Modal Popup -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modal Popup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Gill Sans MT', 'Trebuchet MS';
    }

    .container {
      position: relative;
      background-color: #00b0ffde;
      width: 100%;
      height: 100vh;
    }

    #pribtn {
      position: absolute;
      top: 10%;
      left: 5%;
      width: 300px;
      height: 80px;
      font-size: 20px;
      border: solid 2px white;
      color: white;
      cursor: pointer;
      border-radius: 10px;
      background-color: #125de0;
      box-shadow: 6px 5px 2px rgb(20 20 20);
    }

    #pribtn:active {
      transform: scale(1.1);
    }

    .modal-container {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #fff;
      padding: 20px;
      width: 300px;
      height: 100px;
      border-radius: 5px;
      animation: animateModal;
      animation-duration: 1s;
    }

    .close-btn {
      position: absolute;
      color: black;
      background-color: transparent;
      font-size: 26px;
      border: 0;
      top: 2px;
      right: 13px;
      cursor: pointer;
    }

    .info-txt {
      margin-block: 6px;
      font-size: 18px;
    }

    /* Modal Animation */
    @keyframes animateModal {
      from {
        top: -50%;
        opacity: 0;
      }

      to {
        top: 50%;
        opacity: 1;
      }
    }
  </style>

</head>

<body>
  <div class="container">

    <!-- Modal Button  -->
    <button class="btn" id="pribtn">
      <div>Where's our Modal</div>
    </button>

    <!-- Modal Popup -->
    <div class="modal-container" id="modal">
      <div class="modal">
        <h2 class="title-txt">Good Afternoon</h2>
        <p class="info-txt">👋 Here I am!</p>
        <button class="close-btn" id="clsBtn" onclick="closeModal()">&times;</button>
      </div>
      <!-- <div class="modal-overlay" onclick="closeModal()"></div> -->
    </div>


  </div>

  <!-- SCRIPT  -->
  <script src="./13_Assignment.js"></script>
</body>

</html>
