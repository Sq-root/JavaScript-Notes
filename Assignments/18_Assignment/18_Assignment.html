<!-- Problem Statment: Stop Watch -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer</title>
    <!-- CSS  -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <div class="timer-container">
            <div class="timer-indicators">
                <div class="card">
                    <div class="timer-title">HOURS</div>
                    <h2 class="timer-txt" id="timerhr">00</h2>
                </div>
                <div class="card timer-min">
                    <div class="timer-title">MIN</div>
                    <h2 class="timer-txt" id="timermin">00</h2>
                </div>
                <div class="card timer-sec">
                    <div class="timer-title">SEC</div>
                    <h2 class="timer-txt" id="timersec">00</h2>
                </div>
            </div>
            <div class="timer-controllers">
                <button class="btn" id="start-btn">Start</button>
                <button class="btn" id="pause-btn">Pause</button>
                <button class="btn" id="reset-btn">Reset</button>
            </div>
        </div>
    </div>
    <!-- SCRIPT  -->
    <script src="./18_Assignment.js"></script>
</body>

</html>
