<!-- Problem Statment: Random Qupte Generator -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Quote</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .container {
      background-color: #00b0ffde;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .quote-wrapper {
      width: 550px;
      height: 300px;
      background-color: #fff;
      border-radius: 10px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 30px;
      box-shadow: 6px 5px 2px rgb(20 20 20);
    }

    .quote-text {
      font-family: 'cursive', Courier, monospace;
      font-size: 1.2rem;
      text-align: center;
      line-height: 2rem;
    }

    .bold-text {
      text-transform: uppercase;
      color: rgb(173 37 37 / 63%);
      font-weight: 500;
      margin-block: 10px;
      font-size: 1.6rem;
      letter-spacing: 8px;
    }

    .pri-btn {
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 1.2rem;
      border: none;
      cursor: pointer;
    }

    .pri-btn:active {
      background-color: #80808008;
    }
  </style>

</head>

<body>
  <div class="container">
    <div class="quote-wrapper">
      <div class="quote-text">
        <p class="info-text" id="infoTxt">"Lorem, ipsum dolor sit amet consectetur adipisicing elit.
          Voluptates quae adipisci ipsum nulla, veritatis to"</p>
        <p class="bold-text" id="boldTxt">Alex Roy</p>
      </div>
      <button class="pri-btn" id="pribtn">New Quote</button>
    </div>
  </div>

  <!-- SCRIPT  -->
  <script src="./12_Assignment.js"></script>
</body>

</html>
